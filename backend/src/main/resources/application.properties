spring.application.name=backend
spring.profiles.active=${APP_PROFILE:dev}

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/backenddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

jwt.secret=${JWT_SECRET:YqSHjkAHvraoIY7fJWidenC9SGw+gxYX4LIXNEXwYjXxgYGVreamFu8aQWQ19+XL}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.environment=${APP_ENVIRONMENT:dev}
app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3-bucket=${AWS_S3_BUCKET:hospital-management-files-m}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.endpoint=${AWS_ENDPOINT:}
app.aws.public-endpoint=${AWS_PUBLIC_ENDPOINT:}

# Future secret-store integration placeholders
# AWS Secrets Manager and HashiCorp Vault can override these values without changing code.
# Example: export SPRING_PROFILES_ACTIVE=prod
# Example: export DB_PASSWORD=... JWT_SECRET=... AWS_ACCESS_KEY_ID=...
