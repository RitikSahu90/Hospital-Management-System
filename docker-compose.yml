services:

  mysql:
    image: mysql:8.4
    container_name: hospital-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hospital_management
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

      # Optional: initialize database automatically
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uappuser",
          "-papppassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hospital-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_PROFILE: prod

      DB_URL: jdbc:mysql://mysql:3306/hospital_management
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword

      JPA_DDL_AUTO: validate

      JWT_SECRET: ${JWT_SECRET}

      JWT_EXPIRATION_MS: 86400000

      APP_ENVIRONMENT: prod

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-demo-hospital-bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: hospital-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:
  mysql_data:
